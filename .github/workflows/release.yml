# CI builds the trusted source; private signing keys stay on the signing Mac.
name: Publish signed app
on:
  push:
    branches: [main]
    # The website exporter has its own publication workflow and no app bytes.
    paths: ['Sources/**', 'Tests/**', 'Resources/**', 'Scripts/**', '!Scripts/build-site.py', 'Karabiner/**', 'Integrations/**', 'Package.*', '.github/workflows/check.yml', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: signed-app-release
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/check.yml
  release:
    needs: build
    runs-on: [self-hosted, macOS, ARM64, agentic-mouse-release]
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      CODE_SIGN_IDENTITY: 'Developer ID Application: Ethan Sarif-Kattan (T34G959ZG8)'
      NOTARY_PROFILE: ${{ vars.NOTARY_PROFILE || 'AgentFlowRelease' }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: agentic-mouse-prebuilt
          path: ${{ runner.temp }}/prebuilt.noindex
      - name: Prepare verified signing tools
        run: |
          echo "AGENTIC_MOUSE_BUILD_DIR=$RUNNER_TEMP/AgenticMouse.noindex" >> "$GITHUB_ENV"
          curl --fail --location https://github.com/sparkle-project/Sparkle/releases/download/2.10.1/Sparkle-2.10.1.tar.xz -o "$RUNNER_TEMP/Sparkle.tar.xz"
          echo '1a856d2a9edb8e628de88121d7be04cf0e2167f8641650b78fca00b14244cf27  '"$RUNNER_TEMP/Sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/Sparkle.noindex"
          tar -xf "$RUNNER_TEMP/Sparkle.tar.xz" -C "$RUNNER_TEMP/Sparkle.noindex"
          echo "SPARKLE_TOOLS=$RUNNER_TEMP/Sparkle.noindex/bin" >> "$GITHUB_ENV"
      - name: Sign and notarize the exact CI app
        run: bash Scripts/sign-prebuilt-release.sh "$RUNNER_TEMP/prebuilt.noindex"
      - name: Publish immutable signed updates
        run: |
          # The signing Mac's existing Keychain login has workflow permission;
          # a job token cannot publish an older source after workflow edits.
          unset GH_TOKEN GITHUB_TOKEN
          test "$(gh api --hostname github.com user --jq .login)" = EthanSK
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)
          build=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' Resources/Info.plist)
          tag="v$version-build.$build"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'This release already exists; refusing to replace it.' >&2
            exit 1
          fi
          gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Agentic Mouse $version ($build)" --generate-notes \
            "$AGENTIC_MOUSE_BUILD_DIR"/release/*.zip "$AGENTIC_MOUSE_BUILD_DIR/release/SHA256SUMS" \
            "$AGENTIC_MOUSE_BUILD_DIR/release/release.json" "$AGENTIC_MOUSE_BUILD_DIR/release/appcast.xml"
          gh release edit "$tag" --draft=false --latest
          gh release download "$tag" --dir "$RUNNER_TEMP/downloaded.noindex"
          cd "$RUNNER_TEMP/downloaded.noindex"
          shasum -a 256 -c SHA256SUMS
