name: Check app and onboarding

on:
  workflow_call:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer # The glass HUD needs the macOS 26 SDK; this runner's default Xcode 16 cannot compile it.
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Show the selected toolchain
        run: |
          xcodebuild -version
          xcrun --show-sdk-version
      - name: Install the pinned extension packaging tool
        run: npm ci --ignore-scripts --prefix Integrations/VSCode
      - name: Run the clean hardware-free gate
        env:
          # This is a disposable GitHub runner, not the user's active desktop.
          AGENTIC_MOUSE_ALLOW_VISIBLE_UI_TESTS: '1'
        run: make check
      - name: Package an SDK-free development bundle without installing it
        env:
          ICUE_SDK_FRAMEWORK: /nonexistent/agentic-mouse-sdk
        run: |
          PUBLIC_UNSIGNED_BUILD=1 DISTRIBUTION_BUILD=1 REQUIRE_ICUE_SDK=0 make app
          ditto -c -k --keepParent build.noindex/AgenticMouse.app build.noindex/AgenticMouse-prebuilt.zip
          python3 - <<'PYRECEIPT'
          import hashlib,json,pathlib,subprocess
          path=pathlib.Path('build.noindex/AgenticMouse-prebuilt.zip')
          receipt={'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'sha256':hashlib.sha256(path.read_bytes()).hexdigest()}
          path.with_name('build-receipt.json').write_text(json.dumps(receipt)+'\n')
          PYRECEIPT
      - uses: actions/upload-artifact@v4
        with:
          name: agentic-mouse-prebuilt
          path: |
            build.noindex/AgenticMouse-prebuilt.zip
            build.noindex/build-receipt.json
          retention-days: 3
