name: Check app and onboarding

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Run the clean hardware-free gate
        run: make check
      - name: Package an SDK-free development bundle without installing it
        env:
          ICUE_SDK_FRAMEWORK: /nonexistent/agentic-mouse-sdk
        run: make app
